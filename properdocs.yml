site_name: vibey-gh
site_description: Event-driven GitHub release automation
site_url: https://adammatthewsteinberger.github.io/vibey-gh/
repo_url: https://github.com/adammatthewsteinberger/vibey-gh
repo_name: adammatthewsteinberger/vibey-gh
edit_uri: edit/main/docs/
docs_dir: docs
theme: mkdocs
extra_css:
  - stylesheets/vibey.css
extra_javascript:
  - javascripts/channel.js
markdown_extensions:
  - attr_list
  - md_in_html
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - CLI: cli.md
  - Workflows: workflows.md
  - Security: security.md
  - Operations: operations.md
  - Contributing: development.md
  - Releases: releases.md
  - Support: troubleshooting.md
strict: true
