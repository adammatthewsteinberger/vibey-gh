name: API drift (Cloud Agents OpenAPI)

on:
  push:
    branches: [__VIBEY_GH_INTEGRATION_BRANCH__, __VIBEY_GH_RELEASE_BRANCH__]
  pull_request:
    branches: [__VIBEY_GH_INTEGRATION_BRANCH__, __VIBEY_GH_RELEASE_BRANCH__]

permissions:
  contents: read

jobs:
  parity:
    name: MCP, API, CLI, SDK, and webhook parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify five-surface capability parity
        run: |
          set -euo pipefail
          python -m pip install --quiet .
          python - <<'PY'
          from vibey_gh.surfaces import CAPABILITIES, SURFACES, parity

          expected = tuple(CAPABILITIES)
          actual = parity()
          if tuple(actual) != tuple(SURFACES):
              raise SystemExit(f"surface registry drift: {tuple(actual)!r} != {tuple(SURFACES)!r}")
          drift = {name: values for name, values in actual.items() if tuple(values) != expected}
          if drift:
              raise SystemExit(f"capability parity drift: {drift!r}")
          print(f"{len(expected)} capabilities are exposed through all {len(SURFACES)} surfaces")
          PY
