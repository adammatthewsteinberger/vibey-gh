name: Conventional Commits

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: conventional-commits-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsafe or stale targets
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INTEGRATION_BRANCH: __VIBEY_GH_INTEGRATION_BRANCH__
          RELEASE_BRANCH: __VIBEY_GH_RELEASE_BRANCH__
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$HEAD_REPO" = "$REPO" || { echo "fork history is never rewritten"; exit 1; }
          case "$HEAD_REF" in
            "$INTEGRATION_BRANCH"|"$RELEASE_BRANCH"|develop|main)
              echo "permanent branch history is never rewritten"
              exit 1
              ;;
          esac
          actual=$(gh pr view "${{ github.event.pull_request.number }}" --repo "$REPO" --json headRefOid --jq .headRefOid)
          test "$actual" = "$HEAD_SHA"
      - name: Check out trusted normalizer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: automation
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet ./automation
      - name: Check out exact topic head without executing it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0
          token: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
      - name: Normalize every nonconforming commit message
        working-directory: target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if vibey-gh conventional-check --commits "${BASE_SHA}..${HEAD_SHA}"; then
            echo "Every commit already conforms."
            exit 0
          fi
          test "$(git -C target rev-list --merges --count "${BASE_SHA}..${HEAD_SHA}")" = 0 || {
            echo "Refusing automatic rewrite of merge commits"
            exit 1
          }
          git switch -C "$HEAD_REF" "$HEAD_SHA"
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --msg-filter 'vibey-gh conventional-message' "${BASE_SHA}..${HEAD_REF}"
          current=$(git ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)
          test "$current" = "$HEAD_SHA"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            origin "HEAD:refs/heads/${HEAD_REF}"
