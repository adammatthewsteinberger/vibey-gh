# Made with love by Vibey, the auto-vibecoding machine by Adam Matthew Steinberger.
name: Repository profile

on:
  workflow_run:
    workflows: ["Release surfaces"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read
  packages: read

jobs:
  reconcile:
    name: Reconcile repository profile
    if: >-
      true &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Update identity, Pages homepage, and topics
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          CONFIG_DESCRIPTION: "Event-driven GitHub automation for reviews, repairs, releases, provenance, and beautiful dual-channel documentation."
          CONFIG_TOPICS: '{"names":["automation","continuous-delivery","documentation","github-actions","release-automation"]}'
        run: |
          set -euo pipefail
          pages_url="https://${OWNER}.github.io/${REPO_NAME}/"
          description="$CONFIG_DESCRIPTION"
          if [ -z "$description" ]; then
            description="${REPO_NAME} — automated delivery, release provenance, and living documentation."
          fi
          gh api "repos/${REPO}" --method PATCH \
            -f description="$description" -f homepage="$pages_url" -F has_downloads=true >/dev/null
          printf '%s' "$CONFIG_TOPICS" | gh api "repos/${REPO}/topics" \
            --method PUT --input - >/dev/null

      - name: Verify public release surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 \
            "https://${OWNER}.github.io/${REPO_NAME}/" >/dev/null
          test "$(gh api "repos/${REPO}/releases?per_page=1" --jq 'length')" -gt 0
          test "$(gh api "repos/${REPO}/deployments?per_page=1" --jq 'length')" -gt 0
          package="${OWNER,,}/${REPO_NAME,,}/python"
          registry_token=$(curl --fail --silent --show-error --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            --get --data-urlencode "scope=repository:${package}:pull" \
            'https://ghcr.io/token' | jq -er .token)
          package_found=false
          for channel in main develop; do
            if curl --fail --silent --show-error --head \
              -H "Authorization: Bearer ${registry_token}" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/${package}/manifests/${channel}" >/dev/null; then
              package_found=true
              break
            fi
          done
          test "$package_found" = true
          {
            echo '### Repository profile reconciled'
            echo
            echo "- Homepage: https://${OWNER}.github.io/${REPO_NAME}/"
            echo '- Releases: available'
            echo '- Deployments: available'
            echo '- Packages: available'
            echo '- Protected branches: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
