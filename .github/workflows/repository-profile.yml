name: Repository profile

on:
  workflow_run:
    workflows: ["Release surfaces"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read
  packages: read

jobs:
  reconcile:
    name: Reconcile repository profile
    if: >-
      true &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Update identity, Pages homepage, and topics
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          CONFIG_DESCRIPTION: "Event-driven GitHub automation for reviews, repairs, releases, provenance, and beautiful dual-channel documentation."
          CONFIG_TOPICS: '{"names":["automation","continuous-delivery","documentation","github-actions","release-automation"]}'
          CONFIG_SETTINGS: '{"has_issues":true,"has_projects":true,"has_wiki":false,"has_discussions":true,"allow_squash_merge":true,"allow_merge_commit":false,"allow_rebase_merge":true,"allow_auto_merge":true,"delete_branch_on_merge":false,"web_commit_signoff_required":true,"vulnerability_alerts":true,"automated_security_fixes":true}'
        run: |
          set -euo pipefail
          pages_url="https://${OWNER}.github.io/${REPO_NAME}/"
          description="$CONFIG_DESCRIPTION"
          if [ -z "$description" ]; then
            description="${REPO_NAME} — automated delivery, release provenance, and living documentation."
          fi
          payload=$(printf '%s' "$CONFIG_SETTINGS" | jq \
            --arg description "$description" --arg homepage "$pages_url" \
            '. + {description: $description, homepage: $homepage, has_downloads: true} |
             del(.vulnerability_alerts, .automated_security_fixes)')
          printf '%s' "$payload" | gh api "repos/${REPO}" --method PATCH --input - >/dev/null
          printf '%s' "$CONFIG_TOPICS" | gh api "repos/${REPO}/topics" \
            --method PUT --input - >/dev/null
          security_method() {
            setting=$1
            endpoint=$2
            if [ "$(printf '%s' "$CONFIG_SETTINGS" | jq -r --arg setting "$setting" '.[$setting]')" = true ]; then
              gh api "repos/${REPO}/${endpoint}" --method PUT >/dev/null
            else
              gh api "repos/${REPO}/${endpoint}" --method DELETE >/dev/null
            fi
          }
          security_method vulnerability_alerts vulnerability-alerts
          security_method automated_security_fixes automated-security-fixes

      - name: Verify public release surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          GHCR_TOKEN: ${{ github.token }}
          CONFIG_DESCRIPTION: "Event-driven GitHub automation for reviews, repairs, releases, provenance, and beautiful dual-channel documentation."
          CONFIG_TOPICS: '{"names":["automation","continuous-delivery","documentation","github-actions","release-automation"]}'
          CONFIG_SETTINGS: '{"has_issues":true,"has_projects":true,"has_wiki":false,"has_discussions":true,"allow_squash_merge":true,"allow_merge_commit":false,"allow_rebase_merge":true,"allow_auto_merge":true,"delete_branch_on_merge":false,"web_commit_signoff_required":true,"vulnerability_alerts":true,"automated_security_fixes":true}'
          INTEGRATION_BRANCH: develop
          RELEASE_BRANCH: main
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 \
            "https://${OWNER}.github.io/${REPO_NAME}/" >/dev/null
          test "$(gh api "repos/${REPO}/releases?per_page=1" --jq 'length')" -gt 0
          test "$(gh api "repos/${REPO}/deployments?per_page=1" --jq 'length')" -gt 0
          package="${OWNER,,}/${REPO_NAME,,}/python"
          registry_token=$(curl --fail --silent --show-error --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            --get --data-urlencode "scope=repository:${package}:pull" \
            'https://ghcr.io/token' | jq -er .token)
          package_found=false
          for channel in main develop; do
            if curl --fail --silent --show-error --head \
              -H "Authorization: Bearer ${registry_token}" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/${package}/manifests/${channel}" >/dev/null; then
              package_found=true
              break
            fi
          done
          test "$package_found" = true
          actual=$(gh api "repos/${REPO}")
          expected=$(printf '%s' "$CONFIG_SETTINGS" | jq 'del(.vulnerability_alerts, .automated_security_fixes)')
          jq -e --argjson expected "$expected" --argjson actual "$actual" '
            $expected | to_entries | all(. as $item | $actual[$item.key] == $item.value)
          ' <<< '{}' >/dev/null
          expected_description="$CONFIG_DESCRIPTION"
          if [ -z "$expected_description" ]; then
            expected_description="${REPO_NAME} — automated delivery, release provenance, and living documentation."
          fi
          test "$(printf '%s' "$actual" | jq -r .description)" = "$expected_description"
          test "$(printf '%s' "$actual" | jq -r .homepage)" = \
            "https://${OWNER}.github.io/${REPO_NAME}/"
          test "$(gh api "repos/${REPO}/topics" --jq '.names | sort | join(",")')" = \
            "$(printf '%s' "$CONFIG_TOPICS" | jq -r '.names | sort | join(",")')"
          for branch in "$INTEGRATION_BRANCH" "$RELEASE_BRANCH"; do
            test "$(gh api "repos/${REPO}/branches/${branch}" --jq .protected)" = true
          done
          verify_security() {
            setting=$1
            endpoint=$2
            expected_value=$(printf '%s' "$CONFIG_SETTINGS" | jq -r --arg setting "$setting" '.[$setting]')
            if gh api "repos/${REPO}/${endpoint}" >/dev/null 2>&1; then
              actual_value=true
            else
              actual_value=false
            fi
            test "$actual_value" = "$expected_value"
          }
          verify_security vulnerability_alerts vulnerability-alerts
          verify_security automated_security_fixes automated-security-fixes
          {
            echo '### Repository profile reconciled'
            echo
            echo "- Homepage: https://${OWNER}.github.io/${REPO_NAME}/"
            echo '- Releases: available'
            echo '- Deployments: available'
            echo '- Packages: available'
            echo '- Protected branches: untouched'
            echo '- Collaboration and merge settings: enforced'
            echo '- Vulnerability alerts and automated security fixes: enforced'
            echo '- Automatic branch deletion: disabled (develop is a promotion head)'
          } >> "$GITHUB_STEP_SUMMARY"
