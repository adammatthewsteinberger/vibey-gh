# Made with love by Vibey, the auto-vibecoding machine by Adam Matthew Steinberger.
name: Release

# develop publishes a dev build to TestPyPI; main publishes the real thing to PyPI.
# TestPyPI comes first on the main path because a PyPI version is immutable — it can
# never be reused, even after a yank — so the only chance to catch a bad artifact is
# before it is uploaded.
on:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp a dev version on develop
        if: github.ref == 'refs/heads/develop'
        run: |
          python -m pip install --quiet -e .
          # An index version is immutable, so a develop build cannot reuse the release
          # version; the dev suffix makes each push distinct and sorts it BEFORE the
          # release it anticipates, which is the correct relationship.
          vibey-gh version --dev "${GITHUB_RUN_NUMBER}" --apply

      - id: v
        # Indented inside the block scalar on purpose: a heredoc body written at column 0
        # would terminate the scalar and the workflow would not parse at all.
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          print("version=" + data["project"]["version"])
          PY

      - run: python -m pip install --quiet build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write            # trusted publishing; no token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify:
    name: Verify the TestPyPI artifact
    needs: [build, testpypi]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install that exact version from TestPyPI and run it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # --no-cache-dir: pip caches the simple index, and a cached index can never
          # show an upload made seconds ago.
          for i in $(seq 1 20); do
            if pip install --no-cache-dir --quiet \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "vibey-gh==${VERSION}"; then
              break
            fi
            echo "not indexed yet (attempt $i); waiting"
            sleep 30
          done
          test "$(vibey-gh trailer-key)" = "Made-With"
          echo "installed ${VERSION} from TestPyPI and it runs"

  pypi:
    name: Publish to PyPI
    needs: [build, verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
