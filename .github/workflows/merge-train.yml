# Made with love by Vibey, the auto-vibecoding machine by Adam Matthew Steinberger.
name: Merge train

# A successful PR-automation gate is the primary trigger. Weekly and manual runs remain
# recovery backstops and evaluate every currently ready PR.
on:
  workflow_run:
    workflows: ["PR automation"]
    types: [completed]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      pr:
        description: "Evaluate only this PR number"
        required: false
        type: string
      dry_run:
        description: "Report without merging"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: merge-train-${{ inputs.pr || github.event.workflow_run.head_sha || 'recovery' }}
  cancel-in-progress: false

jobs:
  merge:
    name: merge
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the tooling
        run: |
          set -euo pipefail
          if grep -qE '^name = "vibey-(gh|bootstrap)"' pyproject.toml 2>/dev/null; then
            python -m pip install --quiet -e .
          else
            python -m pip install --quiet vibey-gh
          fi
      - name: Resolve the gated PR
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.pr }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number="${INPUT_PR:-}"
          if [ -z "$number" ] && [ -n "${EVENT_SHA:-}" ]; then
            number=$(gh api "repos/${REPO}/commits/${EVENT_SHA}/pulls" --jq '.[0].number // empty')
          fi
          echo "pr=$number" >> "$GITHUB_OUTPUT"
      - name: Merge what is ready
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${PR:-}" ]; then args+=(--pr "$PR"); fi
          if [ "${{ inputs.dry_run || false }}" = true ]; then args+=(--dry-run); fi
          vibey-gh merge-train "${args[@]}"
