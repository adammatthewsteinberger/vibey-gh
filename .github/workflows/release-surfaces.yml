# Made with love by Vibey, the auto-vibecoding machine by Adam Matthew Steinberger.
name: Release surfaces

# The package registries remain authoritative for Python installation. This workflow adds
# two companion surfaces after that release has succeeded: branch-specific ProperDocs
# sites on one GitHub Pages deployment and an OCI release bundle in GitHub Packages.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      branch:
        description: Release channel to rebuild
        required: true
        type: choice
        options: [develop, main]
      run_id:
        description: Successful Release run containing the dist artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  context:
    name: Resolve successful release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.release.outputs.branch }}
      channel: ${{ steps.release.outputs.channel }}
      other_channel: ${{ steps.release.outputs.other_channel }}
      other_branch: ${{ steps.release.outputs.other_branch }}
      run_id: ${{ steps.release.outputs.run_id }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INTEGRATION_BRANCH: develop
          RELEASE_BRANCH: main
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            branch="$INPUT_BRANCH"
            run_id="$INPUT_RUN_ID"
            conclusion=$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .conclusion)
            sha=$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .head_sha)
            run_branch=$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .head_branch)
            if [ "$conclusion" != success ]; then
              echo "Release run ${run_id} did not succeed" >&2
              exit 1
            fi
            if [ "$run_branch" != "$branch" ]; then
              echo "Release run ${run_id} belongs to ${run_branch}, not ${branch}" >&2
              exit 1
            fi
          else
            branch="$EVENT_BRANCH"
            run_id="$EVENT_RUN_ID"
            sha="$EVENT_SHA"
          fi
          case "$branch" in
            "$INTEGRATION_BRANCH")
              channel=develop
              other_channel=main
              other_branch="$RELEASE_BRANCH"
              ;;
            "$RELEASE_BRANCH")
              channel=main
              other_channel=develop
              other_branch="$INTEGRATION_BRANCH"
              ;;
            *) echo "unsupported release branch: ${branch}" >&2; exit 1 ;;
          esac
          {
            echo "branch=${branch}"
            echo "channel=${channel}"
            echo "other_channel=${other_channel}"
            echo "other_branch=${other_branch}"
            echo "run_id=${run_id}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

  package:
    name: GitHub Package (${{ needs.context.outputs.channel }})
    needs: context
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
          run-id: ${{ needs.context.outputs.run_id }}
          github-token: ${{ github.token }}
      - id: metadata
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import zipfile

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              for line in archive.read(metadata).decode().splitlines():
                  if line.startswith("Version: "):
                      print("version=" + line.removeprefix("Version: "))
                      break
              else:
                  raise SystemExit("wheel metadata has no Version")
          PY
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - name: Publish the exact Python distribution as an OCI package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          CHANNEL: ${{ needs.context.outputs.channel }}
          RELEASE_SHA: ${{ needs.context.outputs.sha }}
        run: |
          set -euo pipefail
          package="ghcr.io/${GITHUB_REPOSITORY,,}/python"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$wheel" && test -n "$sdist"
          oras push "${package}:${VERSION}" \
            --artifact-type application/vnd.pypi.project.release.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${RELEASE_SHA}" \
            "${wheel}:application/vnd.python.wheel" \
            "${sdist}:application/gzip"
          oras tag "${package}:${VERSION}" "$CHANNEL" "sha-${RELEASE_SHA}"
          if [ "$CHANNEL" = main ]; then
            oras tag "${package}:${VERSION}" latest
          fi

  docs:
    name: ProperDocs (${{ needs.context.outputs.channel }})
    needs: context
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: release-surfaces-pages-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}${{ needs.context.outputs.channel }}/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the channel site with ProperDocs
        env:
          CHANNEL: ${{ needs.context.outputs.channel }}
        run: |
          set -euo pipefail
          python -m pip install --quiet \
            'properdocs==1.6.7' 'properdocs-theme-mkdocs==1.6.7'
          if [ ! -f properdocs.yml ]; then
            mkdir -p .properdocs-source
            if [ -f README.md ]; then
              cp README.md .properdocs-source/index.md
            else
              printf '# %s\n' "$GITHUB_REPOSITORY" > .properdocs-source/index.md
            fi
            printf 'site_name: %s\ndocs_dir: .properdocs-source\n' "$GITHUB_REPOSITORY" > .properdocs-release.yml
            config=.properdocs-release.yml
          else
            config=properdocs.yml
          fi
          properdocs build --strict --config-file "$config" --site-dir "channel-site"
          printf '%s\n' "$CHANNEL" > channel-site/release-channel.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-${{ needs.context.outputs.channel }}
          path: channel-site/
          retention-days: 90
      - name: Restore the other release channel
        env:
          CHANNEL: ${{ needs.context.outputs.channel }}
          OTHER_CHANNEL: ${{ needs.context.outputs.other_channel }}
          OTHER_BRANCH: ${{ needs.context.outputs.other_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "pages/${CHANNEL}" "pages/${OTHER_CHANNEL}"
          cp -R channel-site/. "pages/${CHANNEL}/"
          other_run=$(gh run list --workflow release-surfaces.yml \
            --branch "$OTHER_BRANCH" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$other_run" ]; then
            gh run download "$other_run" --name "docs-${OTHER_CHANNEL}" \
              --dir "pages/${OTHER_CHANNEL}"
          else
            echo "::notice::No successful ${OTHER_CHANNEL} documentation artifact exists yet"
          fi
          cat > pages/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Release documentation</title>
          <h1>Release documentation</h1>
          <ul>
            <li><a href="main/">Production documentation (main)</a></li>
            <li><a href="develop/">Test documentation (develop)</a></li>
          </ul>
          HTML
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
